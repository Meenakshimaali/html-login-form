<body>
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(90deg, skyblue,purple);
        }
        form{
            height: 80%;
            width: 30%;
            background-color: white;
            border-radius: 7%;

        }
        .email,.Password,.login{
            height: 25%;
            /* border: 1px solid black; */
            width: 90%;
            margin: auto;
        }
        input{
            text-align: center;
            border: 1px solid gray;
            background-color: lightgray;
            border-radius: 10px;
            height: 40%;
            width: 100%;
            margin-top: 3%;
        }
        h1,.email,.Password,.login{
            /* margin-top: 3%; */
        }
        h1{
            margin-top: 10%;
            margin-bottom: 5%;
        }
        
        #login{
            background: linear-gradient(90deg, skyblue,purple);
        }
        #login:hover{
            background: linear-gradient(90deg,pink,skyblue);
        }
        .Password>p{
            margin-top: 3%;
            color: gray;
            font-style: italic;
        }
        .login>p{
            margin-top: 5%;
            text-align: center;
        }
        a{
            text-decoration: none;
            font-style: italic;
        }
    </style>
</head>
<body>
    <form action="">
        <h1 align="center">Login Form</h1>
        <div class="email">
            <label for="">Email or Phone</label>
            <input type="text" placeholder=" xyz@gmail.com">
        </div>
        <div class="Password">
            <label for="">Password</label>
            <input type="password" placeholder=" Abc@1234">
            <p>Forget Password ?</p>
        </div>
        <div class="login">
            <input type="button" value="LOGIN" id="login">
            <p>Not A Number ?<a href="singup.html">Signup</a></p>
        </div>
    </form>
    
</body>
</html>


</body>
</html>
